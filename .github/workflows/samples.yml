name: Samples
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  samples-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Install the Rust toolchain pinned in deps/rust-toolchain.toml
        run: rustup toolchain install --profile minimal
        working-directory: deps

      - name: Cache the sdk-core cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .zig-cache/cargo-target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CORE_VERSION', 'deps/Cargo.lock', 'deps/rust-toolchain.toml') }}

      # Builds every sample, starts a dev server, runs each sample's worker and starter, and
      # checks the results. See samples/README.md for which samples-go samples are ported.
      - name: Run the samples against a dev server
        run: zig build samples-test
