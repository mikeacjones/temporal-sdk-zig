# Cargo workspace for building the sdk-core C bridge as a static library.
#
# sdk-core does not commit a Cargo.lock (it is a published library), so building
# through its own workspace would resolve every transitive dependency to the
# newest compatible version on each clone. This workspace exists so we own and
# commit the lockfile. The same approach as temporalio/sdk-dotnet's Bridge/Cargo.toml.
#
# The [workspace.*] tables below mirror sdk-core/Cargo.toml, because member
# crates inherit them with `workspace = true` and inheritance resolves against
# this root. scripts/check-core-version.sh fails if they drift.

[workspace]
members = [
    "sdk-core/crates/protos",
    "sdk-core/crates/sdk-core-c-bridge",
]
default-members = ["sdk-core/crates/sdk-core-c-bridge"]
resolver = "3"

[workspace.package]
license = "MIT"
license-file = "sdk-core/LICENSE.txt"

[workspace.dependencies]
bon = { version = "3", default-features = false, features = ["alloc", "implied-bounds"] }
derive_more = { version = "2.0", default-features = false, features = [
    "constructor",
    "display",
    "from",
    "into",
    "debug",
    "try_into",
] }
thiserror = "2"
tonic = { version = "0.14.6", default-features = false }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }
prost = "0.14"
prost-types = { version = "0.7", package = "prost-wkt-types" }
pbjson = "0.9"
pbjson-build = "0.9"
serde_json = "1.0"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release-lto]
inherits = "release"
lto = true
